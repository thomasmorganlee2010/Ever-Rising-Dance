<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>News Admin — EverRising Dance</title>
  <link rel="stylesheet" href="styles.css">
  <script src="news-config.js"></script>
</head>
<body class="news-admin-page">
  <main class="news-admin-shell">
    <header class="news-admin-header">
      <a class="news-admin-brand" href="index.html">
        <img src="logo.png" alt="">
        <span>EverRising Dance</span>
      </a>
      <a class="news-admin-view" href="news.html">View news</a>
    </header>

    <h1>News Admin</h1>
    

    <section class="news-admin-panel" id="editor-panel">
      <div class="news-admin-source">
        <a id="open-news-manager" class="btn" href="#">Open news manager</a>
        <p id="manager-status" class="news-admin-status" aria-live="polite">Checking the news manager configuration...</p>
      </div>
    </section>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
